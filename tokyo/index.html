<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>세은·혜진 도쿄 여행 · 2026.11.13 ~ 11.15</title>
  <meta name="description" content="세은·혜진 도쿄 2박 3일 일정과 동선 지도" />
  <meta property="og:title" content="🗼 세은·혜진 도쿄 2박 3일" />
  <meta property="og:description" content="2026.11.13 ~ 11.15 · 일정과 동선 지도" />
  <meta name="theme-color" content="#5c1019" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/style.css?v=20261111c" />
</head>
<body>
  <header class="hero" id="hero">
    <div class="leaves" id="leaves"></div>
    <div class="hero-inner">
      <p class="hero-kicker" id="heroKicker"></p>
      <h1 id="heroTitle"></h1>
      <p class="hero-sub"><span id="dday"></span> · <span id="heroMembers"></span></p>
      <p class="hero-hint">여기를 눌러보세요 🍁</p>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="schedule" role="tab">📅 일정</button>
    <button class="tab" data-tab="map" role="tab">🗺️ 지도</button>
    <button class="tab" data-tab="food" role="tab">🍜 맛집</button>
    <button class="tab" data-tab="info" role="tab">🧳 준비</button>
    <button class="tab" data-tab="settle" role="tab">🧾 정산</button>
  </nav>

  <div class="plan-switch" id="planSwitch" aria-label="일정안 선택"></div>

  <main>
    <section id="tab-schedule" class="panel active">
      <div id="planSummary"></div>
      <div id="days"></div>
    </section>

    <section id="tab-map" class="panel">
      <div class="day-chips" id="dayChips"></div>
      <div id="map"></div>
      <div id="mapActions"></div>
      <ol class="stop-list" id="stopList"></ol>
    </section>

    <section id="tab-food" class="panel">
      <div id="food"></div>
    </section>

    <section id="tab-info" class="panel">
      <div id="info"></div>
    </section>

    <section id="tab-settle" class="panel">
      <div id="settle"></div>
    </section>
  </main>

  <footer class="foot">즐거운 여행 되세요 🧡</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/data.js?v=20261111c"></script>
  <script src="assets/app.js?v=20261111c"></script>
</body>
</html>
